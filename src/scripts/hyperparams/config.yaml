defaults:
  - dataset: file_cpet
  - features: columns_all
  - optimizer: adam
  - model: tenet_lstm
  - _self_
  # Generati da feature_lstm.py e tune_lstm.py. Se non esistono ancora valgono
  # i default qui sopra, quindi la pipeline parte anche da zero.
  - optional selected: features
  - optional tuned: best

working_dir: ${hydra:runtime.cwd}
data_dir: ${working_dir}/data/
batch_size: 8

# Suddivisione dei dati: il test set resta fuori da tuning e feature selection
split:
  test_size: 0.2
  n_folds: 5
  seed: 42

# Ricerca degli iperparametri (tune_lstm.py)
n_trials: 40
epochs_tuning: 12

# Addestramento finale (train_lstm.py)
epochs_final: 40
patience: 5

# Feature selection (feature_lstm.py): modello baseline uguale per tutti i
# gruppi, così il confronto misura le feature e non gli iperparametri
feature_selection:
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  lr: 1.0e-3
  batch_size: 16
  epochs: 15

feature_groups:
  respiratory: ['Rf', 'VE/VO2', 'VE/VCO2']
  cardiac: ['HR', 'VO2/HR']
  metabolic: ['VO2', 'VCO2']
  load: ['Load']

# Spazio di ricerca di Optuna. I limiti superiori tengono le attivazioni del
# backward in RAM: sequenze fino a 1090 passi, oltre si va in swap.
search:
  hidden_min: 32
  hidden_max: 256
  layers_min: 1
  layers_max: 3
  batch_sizes: [8, 16, 32]
  lr_min: 1.0e-5
  lr_max: 1.0e-2
  wd_min: 1.0e-6
  wd_max: 1.0e-2

defaults:
  # features/selected.yaml lo scrive resp-select-features, model/tuned.yaml e
  # optimizer/tuned.yaml li scrive resp-tune. Sono normali config group e stanno
  # nel repo, quindi una scelta esplicita da riga di comando (model=tenet_lstm,
  # optimizer=sgd, features=columns_all) vince su di loro.
  - dataset: file_cpet
  - features: selected
  - optimizer: tuned
  - model: tuned
  - _self_

# project_root e' un resolver registrato in respiration/paths.py: i percorsi
# non dipendono dalla cartella da cui si lancia il comando.
working_dir: ${hydra:runtime.cwd}
data_dir: ${project_root:}/data

# Suddivisione dei dati: il test set resta fuori da tuning e feature selection
split:
  test_size: 0.2
  n_folds: 5
  seed: 42

# Ricerca degli iperparametri (resp-tune)
n_trials: 40
epochs_tuning: 12

# Addestramento finale (resp-train)
epochs_final: 40
patience: 5

# Feature selection (resp-select-features): modello baseline uguale per tutti i
# gruppi, così il confronto misura le feature e non gli iperparametri
feature_selection:
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  lr: 1.0e-3
  batch_size: 16
  epochs: 15

# Il gruppo load usa Load_peak, non Load: in watt grezzi la colonna entra a
# media 66 dove tutte le altre stanno intorno a 1, e il solo effetto di scala
# peggiora il modello (vedi experiment_load.py).
feature_groups:
  respiratory: ['Rf', 'VE/VO2', 'VE/VCO2']
  cardiac: ['HR', 'VO2/HR']
  metabolic: ['VO2', 'VCO2']
  load: ['Load_peak']

# Spazio di ricerca di Optuna. I limiti superiori tengono le attivazioni del
# backward in RAM: sequenze fino a 1090 passi, oltre si va in swap.
search:
  hidden_min: 32
  hidden_max: 256
  layers_min: 1
  layers_max: 3
  batch_sizes: [8, 16, 32]
  lr_min: 1.0e-5
  lr_max: 1.0e-2
  wd_min: 1.0e-6
  wd_max: 1.0e-2

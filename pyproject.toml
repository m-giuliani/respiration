[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "respirazione"
version = "0.1.0"
description = "Stima delle soglie ventilatorie AT e RC da test CPET con una LSTM"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "optuna>=3.4",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
resp-prepare-data = "respirazione.cli.prepare_data:main"
resp-select-features = "respirazione.cli.select_features:main"
resp-tune = "respirazione.cli.tune:main"
resp-train = "respirazione.cli.train:main"
resp-experiment-load = "respirazione.cli.experiment_load:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Le config viaggiano col package: Hydra risolve config_path come modulo, quindi
# conf/ ha anche un __init__.py.
respirazione = ["conf/**/*.yaml"]
"respirazione.conf" = ["**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
